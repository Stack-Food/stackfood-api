name: SonarQube analysis

on:
    # push:
    #     branches: ["main", "develop", "master"]
    pull_request:
        branches: ["main", "develop", "master"]
    workflow_dispatch:

permissions:
    pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
    build:
        name: Build and analyze
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

            - name: Set up .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  java-version: 17
                  distribution: "zulu"

            - name: Cache SonarQube packages
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: Cache SonarQube scanner
              id: cache-sonar-scanner
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}\scanner
                  key: ${{ runner.os }}-sonar-scanner
                  restore-keys: ${{ runner.os }}-sonar-scanner

            - name: Install SonarQube scanner
              if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
              shell: powershell
              run: |
                  New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
                  dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

            - name: Restore dependencies
              run: dotnet restore

            - name: Validate SonarQube configuration
              shell: powershell
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
                  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
              run: |
                  Write-Host "Validating SonarQube configuration..."

                  if ([string]::IsNullOrWhiteSpace($env:SONAR_HOST_URL)) {
                    Write-Error "SONAR_HOST_URL is not set or is empty. Please configure it in repository variables."
                    exit 1
                  }

                  if ([string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_KEY)) {
                    Write-Error "SONAR_PROJECT_KEY is not set or is empty. Please configure it in repository variables."
                    exit 1
                  }

                  if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
                    Write-Error "SONAR_TOKEN is not set or is empty. Please configure it in repository secrets."
                    exit 1
                  }

                  Write-Host "✓ SONAR_HOST_URL: $env:SONAR_HOST_URL"
                  Write-Host "✓ SONAR_PROJECT_KEY: $env:SONAR_PROJECT_KEY"
                  Write-Host "✓ SONAR_TOKEN: ***"

            - name: Build and analyze
              shell: powershell
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
                  SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
              run: |
                  Write-Host "Starting SonarQube analysis..."

                  ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
                    /k:"$env:SONAR_PROJECT_KEY" `
                    /d:sonar.token="$env:SONAR_TOKEN" `
                    /d:sonar.host.url="$env:SONAR_HOST_URL"

                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "SonarScanner begin failed"
                    exit 1
                  }

                  Write-Host "Building solution..."
                  dotnet build --no-restore --configuration Release

                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Build failed"
                    exit 1
                  }

                  Write-Host "Ending SonarQube analysis..."
                  ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "SonarScanner end failed"
                    exit 1
                  }
